name: Run Unit Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    
    container:
      image: python:3.11-slim

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y cmake zlib1g-dev git build-essential

    - name: Install gym-retro from GitHub
      run: |
        pip install git+https://github.com/openai/retro.git@v0.8.0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install local stable-baselines3
      run: |
        pip install -e ./stable_baselines3

    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -p "*.py"