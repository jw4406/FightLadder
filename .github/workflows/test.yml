name: Run Unit Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install local stable-baselines3
      run: |
        pip install -e ./stable_baselines3

    - name: Create retro mock for testing
      run: |
        mkdir -p /tmp/mock_modules
        echo "# Mock retro module for testing" > /tmp/mock_modules/retro.py
        export PYTHONPATH="/tmp/mock_modules:$PYTHONPATH"

    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -p "*.py"